name: Flutter CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Check Code
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release
